<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Help Desk Simulator — Jaylen Sherrill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* cool room */
  --wall:#243B5C; --wall-2:#1C2E49; --wall-lo:#16253B;
  --floor:#1A2B40; --trim:#33517A;
  --ink:#0D1826;
  /* warm accents */
  --wood:#C9834F; --wood-2:#A96A3C; --wood-lo:#8A5430;
  --lamp:#FFC46B; --lampglow:rgba(255,196,107,.4);
  /* ui */
  --void:#070C14; --panel:#0E1725; --panel-2:#14203221;
  --glass:rgba(18,29,46,.86); --line:#243449; --line-2:#31465F;
  --text:#EAF1FA; --muted:#93A6BE; --muted-2:#657A94;
  --accent:#5B8CFF; --cyan:#3ADCEF; --green:#4ADE9B; --amber:#FFC24D;
  --red:#FF7A72; --violet:#B79BFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--void);color:var(--text);font-family:'Inter',sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}
.stage{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .75s ease;}
.stage.on{opacity:1;pointer-events:auto;}

/* ════════ BOOT ════════ */
#boot{background:var(--void);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;}
.boot-inner{width:100%;max-width:600px;}
.bl{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:2;color:var(--muted-2);white-space:pre-wrap;}
.bl .ok{color:var(--green);} .bl .wr{color:var(--amber);} .bl .hi{color:var(--cyan);} .bl .ac{color:var(--accent);}
.cur{display:inline-block;width:8px;height:14px;background:var(--green);vertical-align:-2px;animation:cbl 1s step-end infinite;}
@keyframes cbl{0%,100%{opacity:1;}50%{opacity:0;}}
.bp{margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted-2);letter-spacing:.14em;}
.bp b{color:var(--text);}
.skip{position:fixed;bottom:20px;right:22px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#334965;} .skip:hover{color:var(--muted);}

/* ════════ OFFICE ════════ */
#office{z-index:50;overflow:hidden;background:#101B2B;}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
.pl{transition:transform .55s cubic-bezier(.2,.8,.3,1);will-change:transform;}
.hot{cursor:pointer;}
.hot .hl{opacity:0;transition:opacity .25s;}
.hot:hover .hl{opacity:1;}

.title-o{
  position:absolute;left:50%;top:5.5%;transform:translateX(-50%);text-align:center;z-index:9;
  pointer-events:none;width:92%;
}
.to-1{font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:clamp(24px,4.4vw,44px);letter-spacing:-.02em;line-height:1.05;
  color:#FFF;text-shadow:0 2px 0 rgba(13,24,38,.6),0 0 44px rgba(91,140,255,.5);}
.to-1 em{font-style:normal;color:var(--amber);}
.to-2{font-family:'JetBrains Mono',monospace;font-size:clamp(9px,1.3vw,11.5px);
  letter-spacing:.3em;color:#9FB8D8;margin-top:9px;text-transform:uppercase;}

.enter-tip{
  position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:9;
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;
  color:#BBD2F0;display:flex;align-items:center;gap:9px;white-space:nowrap;
  background:rgba(13,24,38,.62);padding:9px 17px;border-radius:22px;
  border:1px solid rgba(91,140,255,.32);backdrop-filter:blur(6px);
  animation:bob 2.8s ease-in-out infinite;pointer-events:none;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-5px);}}
.enter-tip .rg{width:8px;height:8px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 0 0 rgba(255,194,77,.65);animation:rgp 2s infinite;}
@keyframes rgp{70%{box-shadow:0 0 0 11px rgba(255,194,77,0);}100%{box-shadow:0 0 0 0 rgba(255,194,77,0);}}

/* ════════ OS ════════ */
#os{z-index:60;display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse 66% 52% at 20% 16%,rgba(91,140,255,.16),transparent 62%),
    radial-gradient(ellipse 52% 46% at 84% 78%,rgba(183,155,255,.11),transparent 66%),
    linear-gradient(160deg,#0A1220 0%,#0C1524 48%,#070C14 100%);}
#os::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(91,140,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(91,140,255,.035) 1px,transparent 1px);
  background-size:58px 58px;
  mask-image:radial-gradient(ellipse 100% 80% at 50% 28%,#000 15%,transparent 76%);
  -webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 28%,#000 15%,transparent 76%);}
.desktop{flex:1;position:relative;overflow:hidden;}

.icons{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:5px;z-index:1;}
.dico{width:92px;padding:10px 6px;border-radius:10px;text-align:center;border:1px solid transparent;transition:background .14s;}
.dico:hover{background:rgba(91,140,255,.11);border-color:rgba(91,140,255,.24);}
.dico .gl{width:44px;height:44px;margin:0 auto 6px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:20px;border:1px solid;}
.dico .lb{font-size:10.5px;color:#CBDCF0;line-height:1.3;font-weight:500;}

.win{position:absolute;background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--line-2);border-radius:13px;overflow:hidden;
  box-shadow:0 32px 92px rgba(0,0,0,.66);display:flex;flex-direction:column;min-width:280px;
  animation:wo .26s cubic-bezier(.2,.9,.3,1);}
@keyframes wo{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:none;}}
.win.closing{animation:wc .18s ease forwards;}
@keyframes wc{to{opacity:0;transform:scale(.96) translateY(8px);}}
.win-bar{height:37px;display:flex;align-items:center;gap:9px;padding:0 12px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(28,42,64,.92),rgba(16,25,39,.92));
  border-bottom:1px solid var(--line);cursor:grab;user-select:none;}
.win-bar:active{cursor:grabbing;}
.wb-d{width:11px;height:11px;border-radius:50%;transition:filter .14s;}
.wb-d:hover{filter:brightness(1.35);}
.wb-d.r{background:#FF6B5F;} .wb-d.y{background:#FFC53D;} .wb-d.g{background:#42D06B;}
.win-ttl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--muted);flex:1;text-align:center;pointer-events:none;}
.win-body{flex:1;overflow-y:auto;padding:20px 22px;}
.win-body::-webkit-scrollbar{width:7px;}
.win-body::-webkit-scrollbar-thumb{background:#28394F;border-radius:5px;}
.win.min{display:none;}

.wh{font-size:20px;font-weight:700;margin-bottom:5px;}
.wsub{font-size:13px;color:var(--muted);margin-bottom:17px;}
.sect{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted-2);margin:20px 0 10px;display:flex;align-items:center;gap:10px;}
.sect::after{content:"";flex:1;height:1px;background:var(--line);}

/* welcome doc */
.hero-w{background:linear-gradient(150deg,rgba(91,140,255,.16),rgba(58,220,239,.05));
  border:1px solid rgba(91,140,255,.28);border-radius:13px;padding:20px 21px;margin-bottom:18px;}
.hero-w h2{font-size:21px;margin-bottom:8px;line-height:1.25;}
.hero-w p{font-size:14px;color:#C3D3E8;line-height:1.65;}
.doc p{font-size:14px;color:var(--muted);line-height:1.72;margin-bottom:13px;overflow-wrap:anywhere;}
.doc p b{color:var(--text);font-weight:600;}
.doc ul{margin:0 0 14px;padding-left:0;list-style:none;}
.doc li{font-size:13.6px;color:var(--muted);line-height:1.6;padding:7px 0 7px 0;
  display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid rgba(36,52,73,.6);}
.doc li:last-child{border-bottom:none;}
.doc li .n{flex-shrink:0;width:23px;height:23px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:600;background:rgba(91,140,255,.14);
  color:var(--accent);border:1px solid rgba(91,140,255,.3);margin-top:1px;}
.doc li .tx{flex:1;min-width:0;}
.doc li .tx b{display:block;color:var(--text);font-size:13.6px;margin-bottom:2px;}
.callout{background:rgba(255,194,77,.09);border:1px solid rgba(255,194,77,.28);
  border-radius:11px;padding:14px 16px;margin-bottom:15px;}
.callout b{display:block;font-family:'Space Grotesk',sans-serif;color:var(--amber);
  font-size:13.5px;margin-bottom:4px;}
.callout p{font-size:13.2px;color:#D6C9A8;line-height:1.62;margin:0;}
.sig{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--muted);}
.sig b{color:var(--text);font-family:'Space Grotesk',sans-serif;}

.prj{background:linear-gradient(160deg,rgba(23,35,54,.75),rgba(14,23,37,.75));
  border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;
  transition:border-color .16s,transform .16s;}
.prj:hover{border-color:#37506E;transform:translateY(-1px);}
.prj-h{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;user-select:none;}
.prj-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0;border:1px solid;}
.prj-t{flex:1;min-width:0;}
.prj-t .n{font-size:13.5px;font-weight:600;line-height:1.3;}
.prj-t .k{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--muted-2);letter-spacing:.07em;margin-top:2px;}
.prj-cv{font-size:10px;color:var(--muted-2);transition:transform .2s;}
.prj.op .prj-cv{transform:rotate(90deg);}
.prj-b{max-height:0;overflow:hidden;transition:max-height .32s ease;}
.prj-bi{padding:0 15px 15px;}
.prj-bi p{font-size:13px;color:var(--muted);margin-bottom:11px;line-height:1.6;overflow-wrap:anywhere;}
.prj-bi p b{color:var(--text);font-weight:600;}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px;}
.mg div{background:rgba(11,18,29,.85);padding:10px 12px;min-width:0;}
.mg span{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);margin-bottom:2px;}
.mg b{font-size:12.5px;overflow-wrap:anywhere;}
.tgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px;}
.tg{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;
  background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.19);color:#A6BEEC;}
.launch{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;
  background:linear-gradient(140deg,var(--accent),#4270E8);color:#fff;font-size:12.5px;font-weight:600;
  box-shadow:0 5px 20px rgba(91,140,255,.34);transition:all .16s;}
.launch:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(91,140,255,.5);}

.rec{background:rgba(13,21,34,.7);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;margin-bottom:9px;display:flex;gap:14px;align-items:flex-start;}
.rec-i{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:16px;border:1px solid;}
.rec-c{flex:1;min-width:0;}
.rec h4{font-size:14px;font-weight:600;margin-bottom:2px;}
.rec .sb{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted-2);
  letter-spacing:.07em;margin-bottom:6px;}
.rec p{font-size:12.8px;color:var(--muted);line-height:1.55;}
.rst{margin-left:auto;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:9px;
  padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.05em;}

.cc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.card{background:rgba(13,21,34,.7);border:1px solid var(--line);border-radius:12px;
  padding:16px 17px;display:block;transition:all .16s;position:relative;overflow:hidden;}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .2s;}
.card:hover{border-color:rgba(91,140,255,.42);transform:translateY(-2px);box-shadow:0 10px 30px rgba(91,140,255,.14);}
.card:hover::after{opacity:.85;}
.card .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted-2);margin-bottom:6px;}
.card .v{font-size:14px;font-weight:600;overflow-wrap:anywhere;}

.term-out{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;
  color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;}
.term-out .p{color:var(--green);} .term-out .c{color:var(--cyan);}
.term-out .a{color:var(--accent);} .term-out .w{color:var(--amber);} .term-out .t{color:var(--text);}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:12px;}
.term-in span{color:var(--green);flex-shrink:0;}
.term-in input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:12px;}

.taskbar{height:47px;flex-shrink:0;background:rgba(11,18,30,.92);backdrop-filter:blur(20px);
  border-top:1px solid var(--line-2);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:50;}
.startb{display:flex;align-items:center;gap:9px;padding:7px 14px;border-radius:9px;
  background:linear-gradient(140deg,rgba(91,140,255,.2),rgba(91,140,255,.08));
  border:1px solid rgba(91,140,255,.32);font-size:12.5px;font-weight:600;transition:all .15s;}
.startb:hover{background:rgba(91,140,255,.28);}
.startb .sq{width:15px;height:15px;border-radius:4px;
  background:linear-gradient(140deg,var(--accent),#8FB0FF);box-shadow:0 0 10px rgba(91,140,255,.55);}
.tb-items{display:flex;gap:6px;flex:1;overflow-x:auto;}
.tb-items::-webkit-scrollbar{height:0;}
.tbi{padding:6px 13px;border-radius:8px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);background:rgba(20,32,50,.65);white-space:nowrap;transition:all .14s;}
.tbi:hover{color:var(--text);border-color:var(--line-2);}
.tbi.act{color:var(--accent);border-color:rgba(91,140,255,.38);background:rgba(91,140,255,.11);}
.tray{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.tray .ic{color:var(--muted-2);display:flex;}
.tb-clock{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.25;}
.tb-clock small{display:block;font-size:9px;color:var(--muted-2);}

.startmenu{position:absolute;bottom:55px;left:12px;width:296px;z-index:60;
  background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--line-2);
  border-radius:14px;padding:11px;box-shadow:0 28px 74px rgba(0,0,0,.72);display:none;animation:wo .2s ease;}
.startmenu.on{display:block;}
.sm-h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted-2);padding:6px 9px 9px;}
.sm-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  font-size:13px;transition:background .14s;width:100%;text-align:left;}
.sm-i:hover{background:rgba(91,140,255,.13);}
.sm-i .e{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px;flex-shrink:0;border:1px solid;}
.sm-sep{height:1px;background:var(--line);margin:7px 4px;}
.hint{position:absolute;bottom:14px;right:16px;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;color:#31465F;letter-spacing:.1em;z-index:1;}

@media(max-width:760px){
  .icons{gap:4px;top:12px;left:12px;}
  .dico{width:76px;padding:8px 4px;}
  .dico .gl{width:37px;height:37px;font-size:17px;}
  .dico .lb{font-size:9.5px;}
  .startb .lbl{display:none;}
  .tb-clock small{display:none;}
  .win-body{padding:16px 16px;}
}
</style>
</head>
<body>

<!-- ════════ BOOT ════════ -->
<div class="stage on" id="boot">
  <div class="boot-inner">
    <div class="bl" id="bootText"></div>
    <div class="bp" id="bootPrompt" style="display:none;">▸ PRESS <b>ANY KEY</b> TO CONTINUE</div>
  </div>
  <button class="skip" id="skipBtn">SKIP ▸</button>
</div>

<!-- ════════ OFFICE ════════ -->
<div class="stage" id="office">

  <svg id="scene" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2A4468"/><stop offset="62%" stop-color="#1F3251"/>
        <stop offset="100%" stop-color="#182740"/>
      </linearGradient>
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1D3049"/><stop offset="100%" stop-color="#12202F"/>
      </linearGradient>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#20365C"/><stop offset="55%" stop-color="#152444"/>
        <stop offset="100%" stop-color="#101B33"/>
      </linearGradient>
      <linearGradient id="deskG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D9915A"/><stop offset="100%" stop-color="#BE7A46"/>
      </linearGradient>
      <linearGradient id="scrG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#123A55"/><stop offset="100%" stop-color="#0C2A42"/>
      </linearGradient>
      <radialGradient id="lampG" cx="50%" cy="0%" r="72%">
        <stop offset="0%" stop-color="rgba(255,196,107,.5)"/>
        <stop offset="100%" stop-color="rgba(255,196,107,0)"/>
      </radialGradient>
      <radialGradient id="monG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(90,190,255,.42)"/>
        <stop offset="100%" stop-color="rgba(90,190,255,0)"/>
      </radialGradient>
      <radialGradient id="vigG" cx="50%" cy="46%" r="66%">
        <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(4,9,17,.72)"/>
      </radialGradient>
      <clipPath id="winClip"><rect x="96" y="112" width="228" height="200" rx="7"/></clipPath>
    </defs>

    <!-- ROOM SHELL -->
    <rect x="0" y="0" width="1200" height="560" fill="url(#wallG)"/>
    <rect x="0" y="556" width="1200" height="200" fill="url(#floorG)"/>
    <rect x="0" y="548" width="1200" height="14" fill="#33517A"/>
    <rect x="0" y="548" width="1200" height="4" fill="#3F6191"/>

    <!-- floor boards -->
    <g stroke="#152537" stroke-width="2" opacity=".55">
      <line x1="120" y1="562" x2="30"  y2="750"/>
      <line x1="360" y1="562" x2="320" y2="750"/>
      <line x1="600" y1="562" x2="600" y2="750"/>
      <line x1="840" y1="562" x2="880" y2="750"/>
      <line x1="1080" y1="562" x2="1170" y2="750"/>
    </g>

    <!-- ══ FAR LAYER ══ -->
    <g class="pl" data-depth="5">

      <!-- WINDOW -->
      <g>
        <rect x="88" y="104" width="244" height="216" rx="11" fill="#2E4A72" stroke="#0D1826" stroke-width="4"/>
        <rect x="96" y="112" width="228" height="200" rx="7" fill="url(#skyG)"/>
        <g clip-path="url(#winClip)">
          <!-- moon -->

function openWin(id){
  if(open[id]){const e=$('w-'+id);e.classList.remove('min');focusWin(id);return;}
  const a=APPS[id], d=$('desktop');
  const w=Math.min(a.w,d.clientWidth-40), h=Math.min(a.h,d.clientHeight-40);
  const n=Object.keys(open).length;
  const left=Math.min(Math.max(20,110+n*26),Math.max(20,d.clientWidth-w-20));
  const top=Math.min(Math.max(16,34+n*22),Math.max(16,d.clientHeight-h-16));
  const el=document.createElement('div');
  el.className='win'; el.id='w-'+id;
  el.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px;z-index:${++z}`;
  el.innerHTML=`<div class="win-bar">
      <div style="display:flex;gap:6px">
        <span class="wb-d r" data-act="close"></span>
        <span class="wb-d y" data-act="min"></span>
        <span class="wb-d g" data-act="max"></span>
      </div>
      <div class="win-ttl">${a.t}</div><div style="width:44px"></div>
    </div><div class="win-body">${bodyFor(id)}</div>`;
  d.appendChild(el); open[id]=true;
  el.querySelectorAll('.wb-d').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation(); const act=b.dataset.act;
    if(act==='close')closeWin(id);
    if(act==='min'){el.classList.add('min');renderTabs();}
    if(act==='max'){
      if(el.dataset.maxed){el.style.cssText=el.dataset.prev+`;z-index:${++z}`;delete el.dataset.maxed;}
      else{el.dataset.prev=el.style.cssText.replace(/z-index:\d+;?/,'');
        el.style.cssText=`left:12px;top:12px;width:${d.clientWidth-24}px;height:${d.clientHeight-24}px;z-index:${++z}`;
        el.dataset.maxed='1';}
    }
  }));
  el.addEventListener('mousedown',()=>focusWin(id));
  makeDrag(el,el.querySelector('.win-bar'));
  if(id==='projects')wireProjects(el);
  if(id==='term')wireTerm(el);
  renderTabs();
}
function closeWin(id){const e=$('w-'+id);if(!e)return;e.classList.add('closing');
  setTimeout(()=>{e.remove();delete open[id];renderTabs();},180);}
function focusWin(id){const e=$('w-'+id);if(e){e.style.zIndex=++z;renderTabs();}}
function makeDrag(el,h){
  let sx,sy,ox,oy,dr=false;
  h.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('wb-d'))return;
    dr=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;
    el.style.zIndex=++z; h.setPointerCapture(e.pointerId);
  });
  h.addEventListener('pointermove',e=>{
    if(!dr)return; const d=$('desktop');
    let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
    nx=Math.max(-el.offsetWidth+90,Math.min(nx,d.clientWidth-70));
    ny=Math.max(0,Math.min(ny,d.clientHeight-38));
    el.style.left=nx+'px'; el.style.top=ny+'px';
  });
  h.addEventListener('pointerup',e=>{dr=false;h.releasePointerCapture(e.pointerId);});
}
function wireProjects(el){
  el.querySelectorAll('.prj').forEach(p=>{
    const hd=p.querySelector('.prj-h'), bd=p.querySelector('.prj-b');
    hd.addEventListener('click',()=>{
      const o=p.classList.contains('op');
      el.querySelectorAll('.prj').forEach(x=>{x.classList.remove('op');x.querySelector('.prj-b').style.maxHeight=null;});
      if(!o){p.classList.add('op');bd.style.maxHeight=bd.scrollHeight+'px';}
    });
  });
  const f=el.querySelector('.prj'); if(f)f.querySelector('.prj-h').click();
}
function wireTerm(el){
  const out=el.querySelector('#termOut'), inp=el.querySelector('#termIn');
  setTimeout(()=>inp.focus(),60);
  el.addEventListener('click',e=>{if(!e.target.closest('a'))inp.focus();});
  const say=h=>{out.innerHTML+=h+'\n';out.parentElement.scrollTop=out.parentElement.scrollHeight;};
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const raw=inp.value.trim(); inp.value='';
    say(`<span class="p">$</span> ${raw}`);
    const [c,...r]=raw.toLowerCase().split(/\s+/); const arg=r.join(' ');
    if(!c){}
    else if(c==='help')say(`<span class="w">help</span>      this list
<span class="w">ls</span>        list simulators
<span class="w">open</span> <span class="c">&lt;n&gt;</span>  launch one by number
<span class="w">about</span>     what a help desk is
<span class="w">whoami</span>    who made this
<span class="w">contact</span>   how to reach me
<span class="w">clear</span>     clear the screen`);
    else if(c==='ls')say(PROJECTS.map((p,i)=>`  <span class="a">${i+1}</span>. ${p.name} <span class="c">— ${p.kind.toLowerCase()}</span>`).join('\n'));
    else if(c==='open'){
      const n=parseInt(arg,10);
      const p=PROJECTS[n-1]||PROJECTS.find(x=>x.name.toLowerCase().includes(arg)||x.id===arg);
      if(p){say(`  launching <span class="t">${p.name}</span>…`);window.open(p.file,'_blank');}
      else say(`  <span class="w">not found</span> — try <span class="c">ls</span>`);
    }
    else if(c==='about')say(`  a help desk is the front door of a company's
  technology. someone reports a problem, it
  becomes a ticket, it gets prioritised, worked,
  escalated if needed, then documented and closed.

  two rules matter most:
    <span class="t">verify before you change anything</span>
    <span class="t">check the simple thing first</span>`);
    else if(c==='whoami')say(`  jaylen sherrill — nashville, tn
  built this so people could see what the job is like`);
    else if(c==='contact')say(`  email     jaylenbaylen@icloud.com
  phone     615-910-9432
  linkedin  jaylen-sherrill`);
    else if(c==='clear')out.innerHTML='';
    else if(c==='exit')closeWin('term');
    else if(c==='sudo')say(`  <span class="w">nice try.</span>`);
    else if(c==='coffee')say(`  <span class="w">supply low.</span> refill at the break room.`);
    else say(`  <span class="w">${c}: command not found</span> — try <span class="c">help</span>`);
  });
}

    return `<button class="tbi ${top?'act':''}" data-tb="${k}">${APPS[k].ico} ${APPS[k].label}</button>`;
  }).join('');
  $('tbItems').querySelectorAll('.tbi').forEach(b=>b.addEventListener('click',()=>{
    const e=$('w-'+b.dataset.tb);
    if(e.classList.contains('min')){e.classList.remove('min');focusWin(b.dataset.tb);}
    else if(+e.style.zIndex===z){e.classList.add('min');renderTabs();}
    else focusWin(b.dataset.tb);
  }));
}
$('startBtn').addEventListener('click',e=>{e.stopPropagation();$('startMenu').classList.toggle('on');});
document.addEventListener('click',e=>{
  if(!e.target.closest('#startMenu')&&!e.target.closest('#startBtn'))$('startMenu').classList.remove('on');
});
function osclock(){const n=new Date();
  $('osClock').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  $('osDate').textContent=n.toLocaleDateString([],{month:'short',day:'numeric'});}
osclock(); setInterval(osclock,10000);
renderIcons();
let seeded=false;
new MutationObserver(()=>{
  if($('os').classList.contains('on')&&!seeded){seeded=true;setTimeout(()=>openWin('welcome'),330);}
}).observe($('os'),{attributes:true,attributeFilter:['class']});
</script>
</body>
