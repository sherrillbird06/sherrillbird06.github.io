<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaylen Sherrill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03060B;
  --room:#070B12;
  --wall:#0B1119;
  --panel:#0C1119;
  --panel-2:#111A27;
  --glass:rgba(16,24,38,.82);
  --line:#1D2837;
  --line-2:#26344a;
  --text:#E8EFF8;
  --muted:#8496AC;
  --muted-2:#5C6D83;
  --accent:#4D7CFF;
  --cyan:#22D3EE;
  --green:#34D399;
  --amber:#FBBF24;
  --red:#F87171;
  --violet:#A78BFA;
  --lamp:#FFB25E;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--void);color:var(--text);
  font-family:'Inter',sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}
.mono{font-family:'JetBrains Mono',monospace;}

.stage{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .8s ease;}
.stage.on{opacity:1;pointer-events:auto;}

/* ══════════════ STAGE 1 · BOOT ══════════════ */
#boot{background:var(--void);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;}
.boot-inner{width:100%;max-width:620px;}
.boot-line{
  font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.95;
  color:var(--muted);white-space:pre-wrap;
}
.boot-line .ok{color:var(--green);}
.boot-line .wr{color:var(--amber);}
.boot-line .hi{color:var(--cyan);}
.boot-line .ac{color:var(--accent);}
.cur{display:inline-block;width:8px;height:14px;background:var(--green);
  vertical-align:-2px;animation:cbl 1s step-end infinite;}
@keyframes cbl{0%,100%{opacity:1;}50%{opacity:0;}}
.boot-prompt{
  margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--muted-2);letter-spacing:.14em;opacity:0;animation:fadeIn .6s ease .2s forwards;
}
.boot-prompt b{color:var(--text);}
@keyframes fadeIn{to{opacity:1;}}
.skip{
  position:fixed;bottom:20px;right:22px;font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.12em;color:#2C3A4E;
}
.skip:hover{color:var(--muted);}

/* ══════════════ STAGE 2 · OFFICE ══════════════ */
#office{
  background:
    radial-gradient(ellipse 50% 40% at 50% 52%,rgba(77,124,255,.13),transparent 68%),
    radial-gradient(ellipse 30% 26% at 84% 64%,rgba(255,178,94,.10),transparent 70%),
    linear-gradient(180deg,#080C14 0%,#0A0F18 50%,#05080E 100%);
  z-index:50;overflow:hidden;
}
.scene{position:absolute;inset:0;}
.pl{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.3,1);will-change:transform;}

/* wall furniture */
.win-frame{
  position:absolute;left:5%;top:12%;width:min(230px,20vw);height:min(290px,34vh);
  border:3px solid #121A26;border-radius:5px;overflow:hidden;
  background:linear-gradient(180deg,#141F36,#0A1120);
  box-shadow:0 0 70px rgba(77,124,255,.10),inset 0 0 46px rgba(0,0,0,.55);
}
.wf-sky{position:absolute;inset:0;background:linear-gradient(180deg,#16233C 0%,#0C1526 60%,#080E1A 100%);}
.wf-city{position:absolute;bottom:0;left:0;right:0;height:50%;}
.wf-rain{position:absolute;inset:0;overflow:hidden;}
.rd{position:absolute;width:1px;background:linear-gradient(180deg,transparent,rgba(150,190,255,.5));
  animation:rain linear infinite;}
@keyframes rain{from{transform:translateY(-40px);}to{transform:translateY(340px);}}
.wf-cross-v{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#121A26;}
.wf-cross-h{position:absolute;top:48%;left:0;right:0;height:3px;background:#121A26;}
.wf-sheen{position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,255,255,.05),transparent 45%);}

.frame-cert{
  position:absolute;right:22%;top:13%;width:112px;padding:11px 10px;
  background:linear-gradient(160deg,#121A28,#0B111B);border:2px solid #1E2A3A;border-radius:3px;
  box-shadow:0 14px 34px rgba(0,0,0,.6);transform:rotate(-.8deg);
}
.frame-cert .fc-t{font-family:'JetBrains Mono',monospace;font-size:6.5px;letter-spacing:.16em;color:var(--amber);text-align:center;}
.frame-cert .fc-m{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;text-align:center;margin:5px 0 3px;color:#C6D6EA;}
.frame-cert .fc-s{font-family:'JetBrains Mono',monospace;font-size:6px;color:var(--muted-2);text-align:center;letter-spacing:.1em;}
.frame-cert .fc-seal{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--amber);
  margin:6px auto 0;opacity:.55;}

.wboard{
  position:absolute;right:5%;top:38%;width:min(150px,14vw);height:96px;
  background:linear-gradient(160deg,#141C28,#0D141E);border:2px solid #1F2A3A;border-radius:3px;
  padding:9px;box-shadow:0 14px 34px rgba(0,0,0,.55);
}
.wb-l{height:2px;border-radius:2px;margin-bottom:7px;}

.clock-w{
  position:absolute;left:33%;top:9%;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#141C28,#080D15);border:2px solid #1D2735;
  box-shadow:0 10px 28px rgba(0,0,0,.55);
}
.cw-h{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:2px;}
.cw-hr{width:2.5px;height:14px;background:#8496AC;margin-left:-1.25px;}
.cw-mn{width:1.5px;height:20px;background:#C3D2E6;margin-left:-.75px;}
.cw-pin{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--accent);}

/* server rack */
.rack-o{
  position:absolute;left:4%;bottom:20%;width:92px;
  background:linear-gradient(160deg,#101724,#080D15);border:1px solid #1C2534;border-radius:7px;
  padding:8px 7px;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 26px 60px rgba(0,0,0,.65);
}
.ru{height:20px;background:#0B111A;border:1px solid #1A2331;border-radius:2px;
  display:flex;align-items:center;padding:0 6px;gap:4px;}
.ru .v{flex:1;height:7px;border-radius:2px;
  background:repeating-linear-gradient(90deg,#141C29 0 2px,transparent 2px 4px);}
.ld{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.ld.g{background:var(--green);box-shadow:0 0 6px var(--green);}
.ld.b{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.ld.a{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.bk1{animation:bk 2.2s infinite;}.bk2{animation:bk 2.2s infinite .5s;}
.bk3{animation:bk 2.2s infinite 1s;}.bk4{animation:bk 2.2s infinite 1.6s;}
@keyframes bk{0%,100%{opacity:1;}50%{opacity:.18;}}

.plant-o{position:absolute;right:6%;bottom:17%;opacity:.9;}

/* DESK */
.desk-o{
  position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,#1B2330 0%,#141B26 16%,#0A0F17 100%);
  border-top:1px solid #2A3546;
}
.desk-o::before{
  content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);
  width:66%;height:82px;pointer-events:none;
  background:radial-gradient(ellipse 50% 100% at 50% 0%,rgba(77,124,255,.22),transparent 72%);
}

/* MONITOR (hotspot) */
.mon-wrap{
  position:absolute;left:50%;bottom:19%;transform:translateX(-50%);
  width:min(430px,52vw);cursor:pointer;z-index:6;
}
.mon{
  background:linear-gradient(165deg,#212A38,#141A24);border-radius:11px;padding:10px 10px 8px;
  box-shadow:0 30px 80px rgba(0,0,0,.72),0 0 0 1px #2B3646,0 0 80px rgba(77,124,255,.20);
  transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s;
}
.mon-wrap:hover .mon{transform:translateY(-5px) scale(1.015);box-shadow:0 36px 96px rgba(0,0,0,.78),0 0 0 1px #3A4A63,0 0 110px rgba(77,124,255,.34);}
.mon-scr{
  background:#060A11;border-radius:6px;overflow:hidden;position:relative;
  aspect-ratio:16/10;box-shadow:inset 0 0 60px rgba(0,0,0,.85);
  display:flex;flex-direction:column;
}
.mon-scr::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);}
.ms-bar{height:16px;background:#0B121C;border-bottom:1px solid #16202E;display:flex;align-items:center;gap:4px;padding:0 7px;}
.ms-dot{width:4.5px;height:4.5px;border-radius:50%;}
.ms-body{flex:1;padding:9px 11px;font-family:'JetBrains Mono',monospace;font-size:7.5px;line-height:1.75;color:#3E5372;overflow:hidden;}
.ms-body .g{color:var(--green);}
.ms-body .c{color:var(--cyan);}
.ms-body .a{color:var(--accent);}
.mon-stand{width:66px;height:26px;margin:0 auto;background:linear-gradient(180deg,#1D2632,#141A24);
  clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);}
.mon-base{width:120px;height:6px;margin:0 auto;border-radius:3px;background:#1A2230;}

.enter-cta{
  position:absolute;left:50%;bottom:-32px;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:8px;
  animation:bob 2.6s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-4px);}}
.enter-cta .ring{width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 0 rgba(77,124,255,.6);animation:rg 2s infinite;}
@keyframes rg{70%{box-shadow:0 0 0 10px rgba(77,124,255,0);}100%{box-shadow:0 0 0 0 rgba(77,124,255,0);}}

/* desk props */
.kbd-o{position:absolute;left:50%;transform:translateX(-50%);bottom:9%;
  width:min(250px,30vw);height:44px;border-radius:6px;
  background:linear-gradient(170deg,#1C2431,#111822);border:1px solid #28323F;
  box-shadow:0 10px 24px rgba(0,0,0,.55);padding:6px 7px;
  display:grid;grid-template-rows:repeat(3,1fr);gap:3px;}
.kr{display:flex;gap:3px;}
.kk{flex:1;background:#141B26;border:1px solid #212B39;border-radius:2px;}
.kk.lit{background:rgba(77,124,255,.22);border-color:rgba(77,124,255,.42);box-shadow:0 0 7px rgba(77,124,255,.3);}
.kk.wd{flex:4;}

.mug-o{position:absolute;right:22%;bottom:12%;}
.mug-b{width:32px;height:34px;border-radius:3px 3px 8px 8px;
  background:linear-gradient(160deg,#2A3444,#19212E);border:1px solid #333F51;
  box-shadow:0 8px 18px rgba(0,0,0,.5);position:relative;}
.mug-b::after{content:"";position:absolute;top:3px;left:3px;right:3px;height:4px;border-radius:2px;
  background:#3B2A1C;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
.mug-h{position:absolute;right:-9px;top:8px;width:11px;height:14px;
  border:2.5px solid #333F51;border-left:none;border-radius:0 8px 8px 0;}
.stm{position:absolute;bottom:36px;left:7px;width:18px;height:24px;}
.stm span{position:absolute;bottom:0;width:2px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,transparent,rgba(200,220,255,.32));animation:st 3.6s ease-in-out infinite;}
.stm span:nth-child(1){left:1px;}
.stm span:nth-child(2){left:8px;animation-delay:1.2s;}
.stm span:nth-child(3){left:15px;animation-delay:2.4s;}
@keyframes st{0%{opacity:0;transform:translateY(4px) scaleY(.5);}35%{opacity:.7;}100%{opacity:0;transform:translateY(-15px) scaleY(1.3);}}

.badge-o{
  position:absolute;left:20%;bottom:11%;width:62px;padding:6px 5px;border-radius:4px;
  background:linear-gradient(160deg,#182131,#0F1620);border:1px solid #263145;
  box-shadow:0 8px 18px rgba(0,0,0,.5);transform:rotate(-6deg);
}
.bg-strip{height:3px;border-radius:2px;background:var(--accent);margin-bottom:4px;opacity:.7;}
.bg-n{font-family:'Space Grotesk',sans-serif;font-size:6.5px;font-weight:700;color:#B9CBE4;line-height:1.2;}
.bg-r{font-family:'JetBrains Mono',monospace;font-size:4.5px;color:var(--muted-2);letter-spacing:.08em;margin-top:1px;}
.bg-ph{width:14px;height:14px;border-radius:2px;background:#22304A;margin-top:3px;}

.note-o{position:absolute;width:46px;height:42px;padding:5px;border-radius:1px;
  font-family:'JetBrains Mono',monospace;font-size:5px;line-height:1.5;color:rgba(28,22,8,.75);
  box-shadow:0 5px 14px rgba(0,0,0,.45);}
.note-o.y{background:linear-gradient(160deg,#C9A227,#AE8B1D);right:31%;bottom:15%;transform:rotate(5deg);}
.note-o.c{background:linear-gradient(160deg,#2E9CA8,#237E89);right:27%;bottom:13%;transform:rotate(-6deg);}

.vig{position:absolute;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(ellipse 88% 78% at 50% 50%,transparent 42%,rgba(0,0,0,.66) 100%);}

.name-plate{
  position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;z-index:7;
}
.np-n{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,4.6vw,46px);font-weight:700;
  letter-spacing:-.015em;text-shadow:0 0 60px rgba(77,124,255,.4);}
.np-s{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.34em;
  color:var(--muted-2);margin-top:7px;text-transform:uppercase;}

/* ══════════════ STAGE 3 · DESKTOP OS ══════════════ */
#os{
  z-index:60;
  background:
    radial-gradient(ellipse 70% 55% at 22% 18%,rgba(77,124,255,.16),transparent 62%),
    radial-gradient(ellipse 55% 48% at 82% 76%,rgba(167,139,250,.11),transparent 66%),
    radial-gradient(ellipse 40% 40% at 60% 45%,rgba(34,211,238,.06),transparent 70%),
    linear-gradient(160deg,#070C14 0%,#0A1019 48%,#05080E 100%);
  display:flex;flex-direction:column;
}
#os::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(77,124,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(77,124,255,.035) 1px,transparent 1px);
  background-size:58px 58px;
  mask-image:radial-gradient(ellipse 100% 80% at 50% 30%,#000 15%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 30%,#000 15%,transparent 75%);
}

.desktop{flex:1;position:relative;overflow:hidden;}

/* desktop icons */
.icons{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:6px;z-index:1;}
.dico{
  width:88px;padding:10px 6px;border-radius:9px;text-align:center;
  transition:background .14s;border:1px solid transparent;
}
.dico:hover{background:rgba(77,124,255,.10);border-color:rgba(77,124,255,.22);}
.dico .gl{
  width:42px;height:42px;margin:0 auto 6px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  border:1px solid;
}
.dico .lb{font-size:10.5px;color:#C3D2E6;line-height:1.3;font-weight:500;}

/* windows */
.win{
  position:absolute;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.66),0 0 0 1px rgba(255,255,255,.02);
  display:flex;flex-direction:column;min-width:280px;
  animation:winOpen .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes winOpen{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:none;}}
.win.closing{animation:winClose .18s ease forwards;}
@keyframes winClose{to{opacity:0;transform:scale(.96) translateY(8px);}}
.win-bar{
  height:36px;display:flex;align-items:center;gap:9px;padding:0 12px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(24,34,52,.9),rgba(14,21,33,.9));
  border-bottom:1px solid var(--line);cursor:grab;user-select:none;
}
.win-bar:active{cursor:grabbing;}
.wb-dots{display:flex;gap:6px;}
.wb-d{width:11px;height:11px;border-radius:50%;transition:filter .14s;}
.wb-d:hover{filter:brightness(1.35);}
.wb-d.r{background:#F0655C;}.wb-d.y{background:#EEBF43;}.wb-d.g{background:#3FC964;}
.win-ttl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--muted);flex:1;text-align:center;pointer-events:none;}
.win-body{flex:1;overflow-y:auto;padding:18px 20px;}
.win-body::-webkit-scrollbar{width:7px;}
.win-body::-webkit-scrollbar-thumb{background:#212D3F;border-radius:5px;}
.win.min{display:none;}

/* window content styles */
.wh{font-size:19px;font-weight:700;margin-bottom:5px;}
.wsub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.sect{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted-2);margin:16px 0 9px;
  display:flex;align-items:center;gap:10px;}
.sect::after{content:"";flex:1;height:1px;background:var(--line);}

.prj{
  background:linear-gradient(160deg,rgba(19,27,40,.7),rgba(11,17,26,.7));
  border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;
  transition:border-color .16s,transform .16s;
}
.prj:hover{border-color:#2E3D56;transform:translateY(-1px);}
.prj-h{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none;}
.prj-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;border:1px solid;}
.prj-t{flex:1;min-width:0;}
.prj-t .n{font-size:13.5px;font-weight:600;line-height:1.3;}
.prj-t .k{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--muted-2);
  letter-spacing:.07em;margin-top:2px;}
.prj-cv{font-size:10px;color:var(--muted-2);transition:transform .2s;}
.prj.op .prj-cv{transform:rotate(90deg);}
.prj-b{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.prj-bi{padding:0 15px 15px;}
.prj-bi p{font-size:13px;color:var(--muted);margin-bottom:11px;line-height:1.58;}
.prj-bi p b{color:var(--text);font-weight:600;}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px;}
.mg div{background:rgba(8,12,19,.75);padding:10px 12px;}
.mg span{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);margin-bottom:2px;}
.mg b{font-size:12.5px;}
.tgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px;}
.tg{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;
  background:rgba(77,124,255,.07);border:1px solid rgba(77,124,255,.17);color:#9DB4E8;}
.launch{
  display:inline-flex;align-items:center;gap:8px;padding:9px 17px;border-radius:9px;
  background:linear-gradient(140deg,var(--accent),#3A63E6);color:#fff;font-size:12.5px;font-weight:600;
  box-shadow:0 5px 20px rgba(77,124,255,.32);transition:all .16s;
}
.launch:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(77,124,255,.48);}

.rec{background:rgba(10,15,24,.65);border:1px solid var(--line);border-radius:11px;
  padding:15px 17px;margin-bottom:9px;display:flex;gap:14px;align-items:flex-start;}
.rec-i{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:16px;border:1px solid;}
.rec h4{font-size:14px;font-weight:600;margin-bottom:2px;}
.rec .sb{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted-2);
  letter-spacing:.07em;margin-bottom:6px;}
.rec p{font-size:12.8px;color:var(--muted);line-height:1.55;}
.rst{margin-left:auto;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:9px;
  padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.05em;}

.cc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.card{background:rgba(10,15,24,.65);border:1px solid var(--line);border-radius:11px;
  padding:16px 17px;display:block;transition:all .16s;position:relative;overflow:hidden;}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .2s;}
.card:hover{border-color:rgba(77,124,255,.4);transform:translateY(-2px);box-shadow:0 10px 30px rgba(77,124,255,.13);}
.card:hover::after{opacity:.85;}
.card .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted-2);margin-bottom:6px;}
.card .v{font-size:14px;font-weight:600;word-break:break-word;}

/* terminal window */
.term-out{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;
  color:var(--muted);white-space:pre-wrap;word-break:break-word;}
.term-out .p{color:var(--green);}
.term-out .c{color:var(--cyan);}
.term-out .a{color:var(--accent);}
.term-out .w{color:var(--amber);}
.term-out .t{color:var(--text);}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px;
  font-family:'JetBrains Mono',monospace;font-size:12px;}
.term-in span{color:var(--green);flex-shrink:0;}
.term-in input{flex:1;background:none;border:none;outline:none;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:12px;}

/* taskbar */
.taskbar{
  height:46px;flex-shrink:0;background:rgba(9,14,22,.9);backdrop-filter:blur(20px);
  border-top:1px solid var(--line-2);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:50;
}
.startb{
  display:flex;align-items:center;gap:9px;padding:7px 14px;border-radius:9px;
  background:linear-gradient(140deg,rgba(77,124,255,.18),rgba(77,124,255,.07));
  border:1px solid rgba(77,124,255,.3);font-size:12.5px;font-weight:600;transition:all .15s;
}
.startb:hover{background:rgba(77,124,255,.26);}
.startb .sq{width:15px;height:15px;border-radius:4px;
  background:linear-gradient(140deg,var(--accent),#7A9BFF);box-shadow:0 0 10px rgba(77,124,255,.5);}
.tb-items{display:flex;gap:6px;flex:1;overflow-x:auto;}
.tb-items::-webkit-scrollbar{height:0;}
.tbi{padding:6px 13px;border-radius:8px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);background:rgba(16,24,38,.6);white-space:nowrap;transition:all .14s;}
.tbi:hover{color:var(--text);border-color:var(--line-2);}
.tbi.act{color:var(--accent);border-color:rgba(77,124,255,.35);background:rgba(77,124,255,.10);}
.tray{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.tray .ic{color:var(--muted-2);display:flex;}
.tb-clock{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.25;}
.tb-clock small{display:block;font-size:9px;color:var(--muted-2);}

/* start menu */
.startmenu{
  position:absolute;bottom:54px;left:12px;width:290px;z-index:60;
  background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line-2);
  border-radius:13px;padding:11px;box-shadow:0 26px 70px rgba(0,0,0,.7);
  display:none;animation:winOpen .2s ease;
}
.startmenu.on{display:block;}
.sm-h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted-2);padding:6px 9px 9px;}
.sm-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  font-size:13px;transition:background .14s;width:100%;text-align:left;}
.sm-i:hover{background:rgba(77,124,255,.12);}
.sm-i .e{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:13px;flex-shrink:0;border:1px solid;}
.sm-sep{height:1px;background:var(--line);margin:7px 4px;}

.hint{
  position:absolute;bottom:14px;right:16px;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;color:#2C3A4E;letter-spacing:.1em;z-index:1;

@media(max-width:760px){
  .win-frame,.frame-cert,.wboard,.clock-w,.rack-o,.plant-o,.badge-o,.note-o,.mug-o{display:none;}

<script>

const $=id=>document.getElementById(id);

/* ---------- CONTENT ---------- */

 {id:'night', file:'night-shift.html', icon:'◐', col:'var(--violet)',

  meta:[['Type','Detection game'],['Messages','6 rounds'],['Red flags','20+ hidden'],['Ranks','D–S']],

let bootIdx=0, bootDone=false;
function bootStep(){
  if(bootIdx>=BOOT.length){ finishBoot(); return; }
  const [txt,cls,suffix]=BOOT[bootIdx];
  const el=$('bootText');
  el.innerHTML += (cls?`<span class="${cls}">${txt}</span>`:txt) + (suffix||'') + '\n';
  bootIdx++;
  setTimeout(bootStep, txt==='' ? 60 : 150+Math.random()*110);
}
function finishBoot(){
  bootDone=true;
  $('bootText').innerHTML += '<span class="cur"></span>';
  $('bootPrompt').style.display='block';
}
function toOffice(){
  if(!bootDone) return;
  $('boot').classList.remove('on');
  setTimeout(()=>$('office').classList.add('on'),260);
  document.removeEventListener('keydown',onBootKey);
}
function onBootKey(){ bootDone ? toOffice() : skipBoot(); }
function skipBoot(){
  bootIdx=BOOT.length;
  $('bootText').innerHTML=BOOT.map(([t,c,s])=>(c?`<span class="${c}">${t}</span>`:t)+(s||'')).join('\n');
  finishBoot();
}
document.addEventListener('keydown',onBootKey);
$('boot').addEventListener('click',()=>bootDone?toOffice():skipBoot());
$('skipBtn').addEventListener('click',e=>{e.stopPropagation();skipBoot();});

    b.innerHTML+=MS[i]+'\n'; i++;
    setTimeout(add,260);

// parallax
let px=0,py=0;
document.addEventListener('mousemove',e=>{
  if(!$('office').classList.contains('on'))return;
  px=(e.clientX/window.innerWidth-.5)*2;
  py=(e.clientY/window.innerHeight-.5)*2;
  document.querySelectorAll('#office .pl').forEach(l=>{
    const d=+l.dataset.depth;
    l.style.transform=`translate3d(${-px*d}px,${-py*d*.55}px,0)`;
  });
});

// office clock
function officeClock(){
  const n=new Date(), h=n.getHours()%12, m=n.getMinutes();
  $('owHr').style.transform=`rotate(${(h+m/60)*30}deg)`;
  $('owMn').style.transform=`rotate(${m*6}deg)`;
}
officeClock(); setInterval(officeClock,20000);

$('monBtn').addEventListener('click',()=>{
  $('office').classList.remove('on');
  setTimeout(()=>{$('os').classList.add('on');},300);
});
$('smOffice').addEventListener('click',()=>{
  $('startMenu').classList.remove('on');
  $('os').classList.remove('on');
  setTimeout(()=>$('office').classList.add('on'),300);
});

/* ─────────── STAGE 3 · DESKTOP OS ─────────── */
const APPS={

  edu:     {t:'education.app',     ico:'✦', col:'var(--amber)',  label:'Education', w:520, h:400},
  contact: {t:'contact.app',       ico:'✉', col:'var(--green)',  label:'Contact', w:520, h:330},
  readme:  {t:'readme.txt',        ico:'▢', col:'var(--muted)',  label:'README', w:490, h:330},
  term:    {t:'terminal',          ico:'>_',col:'var(--cyan)',   label:'Terminal', w:540, h:380}
};
let z=10, open={};

          <div class="prj-t"><div class="n">${p.name}</div><div class="k">${p.kind}</div></div>
          <span class="prj-cv">▶</span>
        </div>
        <div class="prj-b"><div class="prj-bi">
          <p>${p.p1}</p><p>${p.p2}</p>
          <div class="mg">${p.meta.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
          <div class="tgs">${p.tags.map(t=>`<span class="tg">${t}</span>`).join('')}</div>
          <a class="launch" href="${p.file}" target="_blank">▶ ${p.cta}</a>
        </div></div>
      </div>`).join('')}`;
  }
  if(id==='edu'){
    return `<div class="wh">Education</div><div class="wsub">Formal training, stated plainly.</div>
      <div class="rec">
        <div class="rec-i" style="color:var(--accent);background:rgba(77,124,255,.1);border-color:rgba(77,124,255,.24)">✦</div>
        <div><h4>A.A.S., Information Technology</h4>
        <div class="sb">NASHVILLE STATE COMMUNITY COLLEGE · 2024–PRESENT</div>
        <p>Coursework in IT fundamentals, systems, and networking.</p></div>
        <span class="rst" style="color:var(--amber);background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.24)">IN PROGRESS</span>
      </div>
      <div class="rec">
        <div class="rec-i" style="color:var(--cyan);background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.24)">◈</div>
        <div><h4>CompTIA Network+</h4><div class="sb">EXAM PLANNED 2026</div>
        <p>Actively preparing.</p></div>
        <span class="rst" style="color:var(--amber);background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.24)">STUDYING</span>
      </div>
      <div class="rec">
        <div class="rec-i" style="color:var(--muted);background:rgba(132,150,172,.07);border-color:rgba(132,150,172,.18)">○</div>
        <div><h4>CompTIA A+</h4><div class="sb">PLANNED NEXT</div>
        <p>The next target after Network+.</p></div>
        <span class="rst" style="color:var(--muted);background:rgba(132,150,172,.07);border-color:rgba(132,150,172,.18)">PLANNED</span>
      </div>
      <div class="sect">Self-Directed</div>
      <div class="rec">
        <div class="rec-i" style="color:var(--green);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.24)">⟨⟩</div>
        <div><h4>Six working tools, built from scratch</h4><div class="sb">ONGOING</div>
        <p>Plain HTML, CSS and JavaScript throughout — no frameworks, no templates.</p></div>
        <span class="rst" style="color:var(--green);background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.24)">ACTIVE</span>
      </div>`;
  }
  if(id==='contact'){
    return `<div class="wh">Contact</div><div class="wsub">Nashville, TN.</div>
      <div class="cc">
        <a class="card" href="mailto:jaylenbaylen@icloud.com"><div class="k">Email</div><div class="v">jaylenbaylen@icloud.com</div></a>
        <a class="card" href="tel:6159109432"><div class="k">Phone</div><div class="v">615-910-9432</div></a>
        <a class="card" href="https://www.linkedin.com/in/jaylen-sherrill-b91636327" target="_blank" rel="noopener"><div class="k">LinkedIn</div><div class="v">jaylen-sherrill →</div></a>
        <a class="card" href="resume.pdf" target="_blank"><div class="k">Résumé</div><div class="v">Download PDF ↓</div></a>
      </div>`;
  }
  if(id==='readme'){
    return `<div class="wh">README.txt</div>
      <div class="term-out"><span class="c">// about this workstation</span>

  if(id==='term'){
    return `<div class="term-out" id="termOut"><span class="c">jaylen@workstation</span> — type <span class="w">help</span> for commands
</div><div class="term-in"><span>$</span><input id="termIn" autocomplete="off" spellcheck="false"></div>`;

function openWin(id){
  if(open[id]){ focusWin(id); if($('w-'+id).classList.contains('min')) $('w-'+id).classList.remove('min'); return; }
  const a=APPS[id];
  const d=$('desktop');
  const maxW=d.clientWidth-40, maxH=d.clientHeight-40;
  const w=Math.min(a.w,maxW), h=Math.min(a.h,maxH);
  const n=Object.keys(open).length;
  const left=Math.min(Math.max(20, 90+n*26), Math.max(20,d.clientWidth-w-20));
  const top =Math.min(Math.max(16, 40+n*22), Math.max(16,d.clientHeight-h-16));

  const el=document.createElement('div');
  el.className='win'; el.id='w-'+id;
  el.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px;z-index:${++z}`;
  el.innerHTML=`<div class="win-bar">
      <div class="wb-dots">
        <span class="wb-d r" data-act="close"></span>
        <span class="wb-d y" data-act="min"></span>
        <span class="wb-d g" data-act="max"></span>
      </div>
      <div class="win-ttl">${a.t}</div>
      <div style="width:44px"></div>
    </div>
    <div class="win-body">${bodyFor(id)}</div>`;
  d.appendChild(el);
  open[id]=true;

  // controls
  el.querySelectorAll('.wb-d').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const act=b.dataset.act;
    if(act==='close')closeWin(id);
    if(act==='min'){el.classList.add('min');renderTabs();}
    if(act==='max'){
      if(el.dataset.maxed){
        el.style.cssText=el.dataset.prev+`;z-index:${++z}`;
        delete el.dataset.maxed;
      }else{
        el.dataset.prev=el.style.cssText.replace(/z-index:\d+;?/,'');
        el.style.cssText=`left:12px;top:12px;width:${d.clientWidth-24}px;height:${d.clientHeight-24}px;z-index:${++z}`;
        el.dataset.maxed='1';
      }
    }
  }));
  el.addEventListener('mousedown',()=>focusWin(id));
  makeDrag(el,el.querySelector('.win-bar'));

  if(id==='projects') wireProjects(el);
  if(id==='term') wireTerm(el);
  renderTabs();
}

function closeWin(id){
  const el=$('w-'+id); if(!el)return;
  el.classList.add('closing');
  setTimeout(()=>{el.remove();delete open[id];renderTabs();},180);
}
function focusWin(id){ const el=$('w-'+id); if(el){el.style.zIndex=++z; renderTabs();} }

function makeDrag(el,handle){
  let sx,sy,ox,oy,drag=false;
  handle.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('wb-d'))return;
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=el.offsetLeft; oy=el.offsetTop;
    el.style.zIndex=++z;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove',e=>{
    if(!drag)return;
    const d=$('desktop');
    let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
    nx=Math.max(-el.offsetWidth+90,Math.min(nx,d.clientWidth-70));
    ny=Math.max(0,Math.min(ny,d.clientHeight-38));
    el.style.left=nx+'px'; el.style.top=ny+'px';
  });
  handle.addEventListener('pointerup',e=>{drag=false;handle.releasePointerCapture(e.pointerId);});
}

function wireProjects(el){
  el.querySelectorAll('.prj').forEach(p=>{
    const head=p.querySelector('.prj-h'), body=p.querySelector('.prj-b');
    head.addEventListener('click',()=>{
      const isOpen=p.classList.contains('op');
      el.querySelectorAll('.prj').forEach(o=>{o.classList.remove('op');o.querySelector('.prj-b').style.maxHeight=null;});
      if(!isOpen){p.classList.add('op');body.style.maxHeight=body.scrollHeight+'px';}
    });
  });
  const first=el.querySelector('.prj');
  if(first) first.querySelector('.prj-h').click();
}

/* terminal */
function wireTerm(el){
  const out=el.querySelector('#termOut'), inp=el.querySelector('#termIn');
  setTimeout(()=>inp.focus(),60);
  el.addEventListener('click',e=>{if(!e.target.closest('a'))inp.focus();});
  const say=h=>{out.innerHTML+=h+'\n'; out.parentElement.scrollTop=out.parentElement.scrollHeight;};
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const raw=inp.value.trim(); inp.value='';
    say(`<span class="p">$</span> ${raw}`);
    const [cmd,...rest]=raw.toLowerCase().split(/\s+/);
    const arg=rest.join(' ');
    if(!cmd){}
    else if(cmd==='help') say(`<span class="w">help</span>      this list
<span class="w">ls</span>        list projects
<span class="w">open</span> <span class="c">&lt;n&gt;</span>  launch a project by number
<span class="w">whoami</span>    who is this
<span class="w">contact</span>   how to reach me
<span class="w">edu</span>       education
<span class="w">clear</span>     clear the screen
<span class="w">exit</span>      close terminal`);
    else if(cmd==='ls') say(PROJECTS.map((p,i)=>`  <span class="a">${i+1}</span>. ${p.name} <span class="c">— ${p.kind.toLowerCase()}</span>`).join('\n'));
    else if(cmd==='open'){
      const n=parseInt(arg,10);
      const p=PROJECTS[n-1]||PROJECTS.find(x=>x.name.toLowerCase().includes(arg)||x.id===arg);
      if(p){ say(`  launching <span class="t">${p.name}</span>…`); window.open(p.file,'_blank'); }
      else say(`  <span class="w">not found</span> — try <span class="c">ls</span>`);
    }
    else if(cmd==='whoami') say(`  jaylen sherrill — nashville, tn
  builds things, then explains how they work`);
    else if(cmd==='contact') say(`  email     jaylenbaylen@icloud.com
  phone     615-910-9432
  linkedin  jaylen-sherrill`);
    else if(cmd==='edu') say(`  A.A.S. Information Technology — in progress
  CompTIA Network+ — studying
  CompTIA A+ — planned`);
    else if(cmd==='clear') out.innerHTML='';
    else if(cmd==='exit') closeWin('term');
    else if(cmd==='sudo') say(`  <span class="w">nice try.</span>`);
    else say(`  <span class="w">${cmd}: command not found</span> — try <span class="c">help</span>`);
  });
}

/* desktop icons + start menu */
function renderIcons(){
  const order=['projects','term','edu','contact','readme'];
  $('deskIcons').innerHTML=order.map(k=>{
    const a=APPS[k];
    return `<button class="dico" data-app="${k}">
      <div class="gl" style="color:${a.col};background:color-mix(in srgb, ${a.col} 12%, transparent);border-color:color-mix(in srgb, ${a.col} 30%, transparent)">${a.ico}</div>
      <div class="lb">${a.label}</div></button>`;
  }).join('');
  $('deskIcons').querySelectorAll('.dico').forEach(b=>
    b.addEventListener('click',()=>openWin(b.dataset.app)));

  $('smItems').innerHTML=order.map(k=>{
    const a=APPS[k];
    return `<button class="sm-i" data-app="${k}">
      <span class="e" style="color:${a.col};background:color-mix(in srgb, ${a.col} 12%, transparent);border-color:color-mix(in srgb, ${a.col} 30%, transparent)">${a.ico}</span>
      ${a.label}</button>`;
  }).join('');
  $('smItems').querySelectorAll('.sm-i').forEach(b=>
    b.addEventListener('click',()=>{openWin(b.dataset.app);$('startMenu').classList.remove('on');}));
}

function renderTabs(){
  const keys=Object.keys(open);
  $('tbItems').innerHTML=keys.map(k=>{
    const el=$('w-'+k);
    const top = el && !el.classList.contains('min') && +el.style.zIndex===z;
    return `<button class="tbi ${top?'act':''}" data-tb="${k}">${APPS[k].ico} ${APPS[k].label}</button>`;
  }).join('');
  $('tbItems').querySelectorAll('.tbi').forEach(b=>
    b.addEventListener('click',()=>{
      const el=$('w-'+b.dataset.tb);
      if(el.classList.contains('min')){el.classList.remove('min');focusWin(b.dataset.tb);}
      else if(+el.style.zIndex===z){el.classList.add('min');renderTabs();}
      else focusWin(b.dataset.tb);
    }));
}

$('startBtn').addEventListener('click',e=>{e.stopPropagation();$('startMenu').classList.toggle('on');});
document.addEventListener('click',e=>{
  if(!e.target.closest('#startMenu')&&!e.target.closest('#startBtn'))
    $('startMenu').classList.remove('on');
});

function osClock(){
  const n=new Date();
  $('osClock').textContent=n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  $('osDate').textContent=n.toLocaleDateString([], {month:'short',day:'numeric'});
}
osClock(); setInterval(osClock,10000);

renderIcons();
// open the queue automatically the first time the desktop appears
let seeded=false;
new MutationObserver(()=>{
  if($('os').classList.contains('on')&&!seeded){seeded=true;setTimeout(()=>openWin('projects'),340);}
}).observe($('os'),{attributes:true,attributeFilter:['class']});
</script>
